<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SEO Specialist & Content Auditor</title>
    <script>
      // Early shim to prevent libraries from crashing when trying to overwrite window.fetch
      if (typeof window !== 'undefined') {
        window.global = window;
        window.process = { 
          env: { NODE_ENV: 'development' },
          browser: true,
          version: '',
          nextTick: (fn) => setTimeout(fn, 0)
        };
        try {
          const _fetch = window.fetch;
          Object.defineProperty(window, 'fetch', {
            get: () => _fetch,
            set: () => { console.warn('Blocked attempt to overwrite window.fetch'); },
            configurable: true,
            enumerable: true
          });
        } catch (e) {
          console.error('Failed to shim fetch:', e);
        }
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
